[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-policy-guard"
version = "0.2.4"
description = "Policy-as-code enforcement layer for LLM applications — define rules in YAML, enforce at the API layer, audit every violation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vishnu Kosuri", email = "vishnu@aresredteam.com" }]
keywords = ["llm", "policy", "governance", "ai-safety", "guardrails", "pii", "compliance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "PyYAML>=6.0.1",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "jsonschema>=4.22.0",
    "regex>=2024.4.16",
]

[project.optional-dependencies]
openai = ["openai>=1.30.0"]
anthropic = ["anthropic>=0.28.0"]
fastapi = ["fastapi>=0.111.0", "starlette>=0.37.0"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
policy-guard = "llm_policy_guard.cli:app"

[project.urls]
Homepage = "https://github.com/VISHNU0906/llm-policy-guard"
Repository = "https://github.com/VISHNU0906/llm-policy-guard"
Issues = "https://github.com/VISHNU0906/llm-policy-guard/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=llm_policy_guard --cov-report=term-missing --cov-fail-under=80"
